services:
  traefik:
    image: traefik:v3.3
    container_name: berezhok-traefik
    ports:
      - "80:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - berezhok-net
    restart: unless-stopped

  db:
    image: postgis/postgis:16-master
    container_name: berezhok-db
    environment:
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./out/pgdata:/var/lib/postgresql/data
    networks:
      - berezhok-net
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ${DB_NAME} -U ${DB_USER}"]
      timeout: 10s
      interval: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: berezhok-redis
    hostname: redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./out/redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - berezhok-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: berezhok-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"        # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # Management UI
    volumes:
      - ./out/rabbitmq-data:/var/lib/rabbitmq
    networks:
      - berezhok-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: berezhok-api
    environment:
      - DB_HOST=${DOCKER_DB_HOST:-db}
      - DB_PORT=${DOCKER_DB_PORT:-5432}
      - REDIS_HOST=${DOCKER_REDIS_HOST:-redis}
      - REDIS_PORT=${DOCKER_REDIS_PORT:-6379}
      - HTTP_SERVER_ADDRESS=${HTTP_SERVER_ADDRESS:-0.0.0.0:8080}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${DOCKER_RABBITMQ_HOST:-rabbitmq}:${DOCKER_RABBITMQ_PORT:-5672}/
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - berezhok-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api/`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=20"
      - "traefik.http.routers.api.middlewares=api-ratelimit@file,secure-headers@file"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: berezhok-frontend
    depends_on:
      api:
        condition: service_started
    networks:
      - berezhok-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  mobile-web:
    image: nginx:1.27-alpine
    container_name: berezhok-mobile-web
    ports:
      - "${MOBILE_WEB_PORT:-3001}:80"
    volumes:
      - ./mobile-web:/usr/share/nginx/html:ro
      - ./mobile-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - berezhok-net
    restart: unless-stopped

  # chat:
  #   image: berezhok-chat:latest
  #   container_name: berezhok-chat
  #   networks:
  #     - berezhok-net
  #   restart: unless-stopped
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.chat-api.rule=PathPrefix(`/chat-api/`)"
  #     - "traefik.http.routers.chat-api.entrypoints=web"
  #     - "traefik.http.routers.chat-api.priority=30"
  #     - "traefik.http.routers.chat-api.middlewares=chat-api-rewrite@file,api-ratelimit@file"
  #     - "traefik.http.routers.chat-ws.rule=PathPrefix(`/chat-ws`)"
  #     - "traefik.http.routers.chat-ws.entrypoints=web"
  #     - "traefik.http.routers.chat-ws.priority=25"
  #     - "traefik.http.routers.chat-ws.middlewares=chat-ws-rewrite@file"
  #     - "traefik.http.services.chat.loadbalancer.server.port=8090"

  seed:
    image: golang:alpine
    container_name: berezhok-seed
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/root/go/pkg/mod
    environment:
      - CONFIG_PATH=/noop
      - ENV=local
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - berezhok-net
    profiles: ["seed"]
    restart: "no"
    command: go run ./cmd/seed

networks:
  berezhok-net:
    driver: bridge

volumes:
  go-mod-cache:
