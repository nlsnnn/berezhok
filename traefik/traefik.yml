api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@fooday.live
      storage: /etc/traefik/acme.json
      tlsChallenge: {}

providers:
  docker:
    exposedByDefault: false
    network: berezhok-net
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO
